[project]
name = "apitest"
version = "0.1.0"
description = "通用 API 测试框架：薄 SDK + 断言级证据 + 可定制 HTML 报告"
requires-python = ">=3.11"
readme = "docs/design.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
apitest = "apitest.runner.cli:main"

[project.entry-points.pytest11]
apitest = "apitest.runner.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apitest"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
python_files = ["test_*.py"]
addopts = "-q"
